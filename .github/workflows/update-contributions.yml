name: Update contribution graph

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-contributions
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate contribution graphs
        run: node scripts/generate-contributions.mjs --username "${{ github.repository_owner }}" --output-dir assets

      - name: Commit updated graphs
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- assets/contributions-light.svg assets/contributions-dark.svg)" ]]; then
            echo "Contribution graphs are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/contributions-light.svg assets/contributions-dark.svg
          git commit -m "chore: update contribution graph"
          git push
